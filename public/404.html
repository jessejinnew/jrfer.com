<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | JRFER</title>
  <meta name="description" content="The page you requested could not be found.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#141210">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4ede4;
      --bg-deep: #e5d5c0;
      --panel: rgba(255, 250, 244, 0.74);
      --ink: #191614;
      --muted: #685d54;
      --accent: #b8572e;
      --shadow: 0 30px 90px rgba(71, 43, 19, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.88), transparent 25%),
        radial-gradient(circle at 85% 15%, rgba(219, 120, 76, 0.22), transparent 22%),
        radial-gradient(circle at 80% 80%, rgba(120, 91, 56, 0.16), transparent 20%),
        linear-gradient(135deg, var(--bg) 0%, #f0e5d7 52%, var(--bg-deep) 100%);
      font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(30, 22, 16, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 22, 16, 0.035) 1px, transparent 1px);
      background-size: 46px 46px;
      content: "";
      mask-image: radial-gradient(circle at center, black 35%, transparent 78%);
      pointer-events: none;
    }

    main {
      width: min(760px, 100%);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid rgba(40, 29, 17, 0.10);
      border-radius: 36px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: enter 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(25, 22, 20, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d6784c, #7d4325);
      box-shadow: 0 0 0 6px rgba(184, 87, 46, 0.12);
    }

    .code {
      margin-top: clamp(34px, 8vw, 64px);
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 12px;
      font-size: clamp(3rem, 9vw, 6.2rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .accent {
      color: var(--accent);
    }

    .message {
      max-width: 34rem;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.16rem);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border: 1px solid rgba(25, 22, 20, 0.12);
      border-radius: 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.58);
      font-weight: 700;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .button-primary {
      border-color: transparent;
      color: #fff9f4;
      background: linear-gradient(135deg, #141210, #2c1d14 60%, #8b4b2b 130%);
      box-shadow: 0 14px 30px rgba(58, 33, 15, 0.22);
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(58, 33, 15, 0.18);
    }

    .button:focus-visible {
      outline: 3px solid rgba(184, 87, 46, 0.35);
      outline-offset: 4px;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }

      main {
        border-radius: 28px;
      }

      .actions {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>jrfer.com</span>
    </div>

    <p class="code">Error 404</p>
    <h1 id="page-title">Page not found<span class="accent">.</span></h1>
    <p class="message">
      The address may be incorrect, or the page may have moved. Return home or get in touch.
    </p>

    <div class="actions">
      <a class="button button-primary" href="/">Return home</a>
      <a class="button" href="mailto:info@jrfer.com">Email Jesse</a>
    </div>
  </main>
</body>
</html>
